name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Android APK
        run: |
          # The 'yes |' prefix answers "yes" automatically to the Flutter SDK installation prompt
          yes | flet build apk
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scada-remote-app
          path: build/apk/*.apk
